# RQ6 -- How close is the learned coverage to an empirical Stackelberg
# equilibrium? Does it stay robust against unseen best-response algorithms?
#
# held_out_attacker evaluates the committed coverage but never selects it. More
# rounds than the other configs: the gap is reported as a trajectory, since
# whether it closes at all is open.
name: "rq6_equilibrium_gap"

menu: "full"
selector: "minimax"
attacker: "pair"
held_out_attacker: "template"  # swap to "search" once that stub is implemented
judge: "flow_judge"

attack_benchmark: "harmbench"
benign_benchmark: "xstest_alpaca"
n_attack_prompts: 100
n_benign_prompts: 100
fit_frac: 0.5

rounds: 6
attack_budget: 5
tau: 0.7

seeds: [1997, 2, 42]
