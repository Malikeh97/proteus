# RQ3 -- Does randomized deployment buy a better point on the RISK-HELPFULNESS
# frontier than any single configuration can occupy?
#
# Distinct from RQ1, which asks the pure-ASR question on the iso-safety menu at a
# tau that barely binds. Here tau is the WHOLE POINT: the menu is a capability
# gradient, so the achievable set is the convex hull of four (Help_q, JB_q) points
# and the deterministic baseline is confined to its vertices. Whenever tau falls
# strictly between two adjacent Help_q, a mixture sits exactly on the floor while
# deterministic must overshoot to the next vertex up. See configs/menus/frontier.yaml.
#
# Unlike RQ1's argument, this one needs no adaptation penalty -- it holds against a
# static attacker. `pair` is still the attacker here so the result is comparable to
# RQ1; run it with --attacker static to isolate the pure interpolation effect.
#
# Run once per selector via --selector; the comparison is across those runs at
# matched tau, and tau is swept in run_experiments.sh rather than fixed here.
#
# THE TAU SWEEP CANNOT BE CHOSEN IN ADVANCE. Quality-weighted Help compresses the
# scale (the top member lands near 0.85-0.95, not 1.0), so RQ1's 0.7/0.8/0.9 points
# are almost certainly wrong for this menu. Probe first, read the four Help values
# off the Phase-1 log, then place tau strictly BETWEEN adjacent values. A tau at or
# below min_q Help_q makes the floor inert and the whole question vanishes.
name: "rq3_frontier"

menu: "frontier"
selector: "uniform"
attacker: "pair"
judge: "flow_judge"

attack_benchmark: "harmbench"
benign_benchmark: "xstest_alpaca"
n_attack_prompts: 100
n_benign_prompts: 100
fit_frac: 0.5

rounds: 1
attack_budget: 10
tau: 0.7
c_min: 0.0

seeds: [1997, 2, 42]
