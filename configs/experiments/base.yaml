name: "base"

menu: "full"
selector: "uniform"
attacker: "pair"
judge: "llama3.1_8b_judge"
held_out_attacker: null

attack_benchmark: "harmbench"
benign_benchmark: "xstest_alpaca"
n_attack_prompts: 100
n_benign_prompts: 100
fit_frac: 0.3

rounds: 1
attack_budget: 10
tau: 0.7
c_min: 0.0

seeds: [1997, 2, 42]
